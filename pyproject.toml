[project]
name = "dci-triage-assistant"
version = "0.1.0"
description = "DCI Triage Assistant — AI-powered support ticket classification"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Web framework + ASGI server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Config — reads .env automatically; python-dotenv is a bundled transitive dep
    "pydantic-settings>=2.6.0",
    # AI orchestration — Microsoft Agent Framework (successor to Semantic Kernel + AutoGen)
    # Docs: https://learn.microsoft.com/en-us/agent-framework/
    # agent-framework-core[all] pulls in agent-framework-foundry, azure-ai-projects,
    # azure-identity, and openai as transitive deps — no separate entries needed.
    "agent-framework>=1.3.0",
    # Azure Monitor telemetry — required by FoundryChatClient.configure_azure_monitor().
    # Wires OTel traces/metrics/logs from MAF into Application Insights via the
    # Foundry project's connection string. agent_framework.observability is already
    # included in agent-framework-core; this package provides the Azure exporter.
    "azure-monitor-opentelemetry>=1.6.0",
    # Async HTTP client for HelpdeskClient
    "httpx>=0.27.0",
    # HTML templating — serves the intake form at GET /
    # FastAPI first-class support: Jinja2Templates; no python-multipart needed
    # because the form submits via fetch() posting JSON to POST /triage.
    "jinja2>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_assistant"]

[tool.uv]
# agent-framework ships prerelease versions; allow them during resolution
prerelease = "allow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
